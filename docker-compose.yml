services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: password
    ports:
      # ホスト5432はローカルPostgreSQL/他プロジェクトのdocker-compose(myblog等)が
      # 使用していることがあるため5433に公開。既知の開発用パスワードのため
      # 127.0.0.1限定でLAN等からアクセスできないようにする
      - "127.0.0.1:5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:create && bin/rails db:migrate && bin/rails s -b 0.0.0.0 -p 3000"
    volumes:
      - .:/demo_ec
      - tmp:/demo_ec/tmp
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_HOST=db
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=password

volumes:
  tmp:
  db_data:
