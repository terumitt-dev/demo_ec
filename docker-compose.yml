services:
  db:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_PASSWORD: password
    ports:
      # ホスト5432はローカルPostgreSQL/他プロジェクトのdocker-compose(myblog等)が
      # 使用していることがあるため5433に公開
      - "5433:5432"

  web:
    build: .
    command: bash -c "rm -f tmp/pids/server.pid && bin/rails db:create && bin/rails db:migrate && bin/rails s -b 0.0.0.0 -p 3000"
    volumes:
      - tmp:/demo_ec/tmp
      - .:/demo_ec
    ports:
      - "3000:3000"
    depends_on:
      - db
    environment:
      - DATABASE_HOST=db
      - DATABASE_USERNAME=postgres
      - DATABASE_PASSWORD=password

volumes:
  tmp:
